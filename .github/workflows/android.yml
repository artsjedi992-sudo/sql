# Име на автоматичния процес за компилация на Android APK.
name: Build Android APK

# Събития, които стартират автоматичната компилация.
on:
  # Стартирай компилация при промени в основните клонове.
  push:
    branches: [ "main", "master" ]
  # Проверявай и промените, изпратени чрез pull request.
  pull_request:
  # Позволява ръчно стартиране от страницата Actions.
  workflow_dispatch:

# Задачи, които GitHub Actions изпълнява.
jobs:
  build:
    # Използвай временна виртуална машина с Ubuntu.
    runs-on: ubuntu-latest
    steps:
      # Изтегли файловете на хранилището в средата за компилация.
      - name: Checkout source
        uses: actions/checkout@v4
      # Инсталирай JDK 17, необходим за компилацията.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Използвай дистрибуцията Eclipse Temurin.
          distribution: temurin
          # Версията на Java за компилацията.
          java-version: '17'
      # Компилирай debug APK чрез Gradle.
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          # Използвай Gradle 8.7 за тази компилация.
          gradle-version: '8.7'
          # Командата създава APK за отстраняване на грешки.
          arguments: assembleDebug
      # Запази APK като артефакт, който може да се изтегли от Actions.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Име на артефакта, показван в GitHub Actions.
          name: PhoneDatabaseBrowser-debug
          # Пътят до APK, генериран от Gradle.
          path: app/build/outputs/apk/debug/app-debug.apk
