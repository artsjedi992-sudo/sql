plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

android {
    namespace 'com.example.phonedatabasebrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.phonedatabasebrowser'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
