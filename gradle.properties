# Памет и кодировка, използвани от Java процеса на Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Използвай AndroidX библиотеките вместо старите Android Support библиотеки.
android.useAndroidX=true
# Генерирай R класове само с ресурсите, използвани от съответния модул.
android.nonTransitiveRClass=true
